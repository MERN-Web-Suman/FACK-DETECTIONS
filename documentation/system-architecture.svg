<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="500" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
    PhishGuard AI — Complete System Architecture
  </text>
  <text x="500" y="70" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">
    End-to-End URL Ingestion, Machine Learning Classification & SOC Telemetry
  </text>

  <!-- 1. Frontend Layer -->
  <rect x="50" y="110" width="260" height="480" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="125" width="230" height="38" rx="8" fill="#06b6d4" opacity="0.15"/>
  <text x="180" y="149" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    FRONTEND (React + Vite)
  </text>
  
  <rect x="65" y="180" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="80" y="202" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Live URL Scanner UI</text>
  <text x="80" y="218" fill="#94a3b8" font-family="monospace" font-size="10">Real-time Progress &amp; Meter</text>

  <rect x="65" y="240" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="80" y="262" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">User &amp; Admin Dashboards</text>
  <text x="80" y="278" fill="#94a3b8" font-family="monospace" font-size="10">Telemetry Graphs, Stats Cards</text>

  <rect x="65" y="300" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="80" y="322" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Auth &amp; Session Context</text>
  <text x="80" y="338" fill="#94a3b8" font-family="monospace" font-size="10">JWT Storage, Role Guards</text>

  <rect x="65" y="360" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="80" y="382" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Scan History &amp; CSV Export</text>
  <text x="80" y="398" fill="#94a3b8" font-family="monospace" font-size="10">Search, Filtering &amp; Reports</text>

  <!-- 2. Backend Layer -->
  <rect x="370" y="110" width="260" height="480" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2" filter="url(#shadow)"/>
  <rect x="385" y="125" width="230" height="38" rx="8" fill="#3b82f6" opacity="0.15"/>
  <text x="500" y="149" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    BACKEND API (Node.js/Express)
  </text>

  <rect x="385" y="180" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="400" y="202" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">REST API Controllers</text>
  <text x="400" y="218" fill="#94a3b8" font-family="monospace" font-size="10">/auth, /scans, /users, /admin</text>

  <rect x="385" y="240" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="400" y="262" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">JWT &amp; RBAC Middleware</text>
  <text x="400" y="278" fill="#94a3b8" font-family="monospace" font-size="10">Protect &amp; RequireAdmin</text>

  <rect x="385" y="300" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="400" y="322" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Heuristic Inference Core</text>
  <text x="400" y="338" fill="#94a3b8" font-family="monospace" font-size="10">25 Lexical Signals + SSL Audit</text>

  <rect x="385" y="360" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="400" y="382" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Data Persistence Layer</text>
  <text x="400" y="398" fill="#94a3b8" font-family="monospace" font-size="10">MongoDB &amp; Resilient Memory</text>

  <!-- 3. ML Service Layer -->
  <rect x="690" y="110" width="260" height="480" rx="12" fill="#111827" stroke="#1f2937" stroke-width="2" filter="url(#shadow)"/>
  <rect x="705" y="125" width="230" height="38" rx="8" fill="#8b5cf6" opacity="0.15"/>
  <text x="820" y="149" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    ML SERVICE (FastAPI / Scikit)
  </text>

  <rect x="705" y="180" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="720" y="202" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Feature Extraction Engine</text>
  <text x="720" y="218" fill="#94a3b8" font-family="monospace" font-size="10">url, domain, security features</text>

  <rect x="705" y="240" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="720" y="262" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Random Forest Classifier</text>
  <text x="720" y="278" fill="#94a3b8" font-family="monospace" font-size="10">phishing_model.pkl &amp; scaler.pkl</text>

  <rect x="705" y="300" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="720" y="322" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">FastAPI Prediction API</text>
  <text x="720" y="338" fill="#94a3b8" font-family="monospace" font-size="10">POST /predict (Pydantic)</text>

  <rect x="705" y="360" width="230" height="50" rx="8" fill="#1e293b"/>
  <text x="720" y="382" fill="#f8fafc" font-family="system-ui" font-size="12" font-weight="600">Training &amp; Dataset Pipe</text>
  <text x="720" y="398" fill="#94a3b8" font-family="monospace" font-size="10">phishing.csv &amp; legitimate.csv</text>

  <!-- Arrows -->
  <line x1="310" y1="205" x2="370" y2="205" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="368,200 378,205 368,210" fill="#06b6d4"/>

  <line x1="630" y1="325" x2="690" y2="325" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="688,320 698,325 688,330" fill="#8b5cf6"/>

  <!-- Footer note -->
  <text x="500" y="625" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">
    Secure REST Protocol • Non-blocking Async Inference • Resilient Fallback Architecture
  </text>
</svg>

